# agent-node Configuration
# ─────────────────────────────────
service:
  name: agent-node
  version: "2.0"
  description: "Lightweight Linux deployment node"

server:
  host: "0.0.0.0"
  port: 8080  # Overridden by PORT env var at runtime

# Authentication for hidden endpoints
auth:
  token: "${MONITOR_TOKEN}"  # Set via environment variable
  # Endpoints /api/* and /ws/* require Bearer token auth

# SSH settings for outbound connections
ssh:
  enabled: true
  target_host: "${SSH_TARGET}"      # e.g., user@host:port
  private_key: "${SSH_KEY}"          # Base64-encoded private key
  auto_tunnel: "${SSH_AUTO_TUNNEL}"  # true/false

# xray configuration
xray:
  enabled: "${XRAY_ENABLED}"  # true/false
  config_url: "${XRAY_CONFIG_URL}"  # URL to fetch xray config (VMESS/VLESS/JSON)
  binary_name: "agent"  # Renamed to avoid security scans
  listen_port: "${XRAY_PORT}"  # Port for xray to listen on

# Health monitoring
monitoring:
  health_path: /health
  metrics_path: /api/diagnostics
  interval: 30

# Logging
logging:
  level: info
  dir: /var/log/agent-node
  max_size: 10MB
  max_files: 3
